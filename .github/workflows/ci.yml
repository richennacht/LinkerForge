name: Continuous integration

on:
  push:
    branches:
      - main
      - integration
      - "work/**"
  pull_request:
    branches:
      - main
      - integration
      - codex/dfl-research-handoff
      - codex/fusion-linker-generator
      - codex/attachment-site-scorer
      - codex/design-pipeline-readiness

permissions:
  contents: read

jobs:
  schema-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install schema validator
        run: python -m pip install jsonschema==4.25.1
      - name: Validate JSON Schema contracts
        run: python scripts/validate_json_schemas.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exact dependencies
        run: npm ci
      - name: Check code
        run: npm run lint
      - name: Run tests
        run: npm run test
      - name: Build site
        run: npm run build

